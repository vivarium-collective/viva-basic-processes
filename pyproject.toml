[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viva-basic-processes"
version = "0.2.0"
description = "Reusable, composite-agnostic process-bigraph processes — Clock, Intervention, MathExpression, and beyond (was pbg-basic-processes)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "process-bigraph>=1.4.12",
    "bigraph-schema",
    "sympy",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

# Ship the real package (viva_basic_processes) plus the pbg_basic_processes
# import shim (a meta-path redirect to viva_basic_processes) for back-compat.
[tool.setuptools.packages.find]
include = ["viva_basic_processes*", "pbg_basic_processes*"]
