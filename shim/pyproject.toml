[project]
name = "pbg-basic-processes"
# The pre-rename dist was never published to PyPI (git-only), so this can start
# fresh; keep it in lockstep with viva-basic-processes.
version = "0.2.0"
description = "Deprecated alias — the package was renamed to 'viva-basic-processes'. This shim just depends on it so existing 'pbg-basic-processes' deps keep resolving. Import 'viva_basic_processes' (a 'pbg_basic_processes' import shim also ships in viva-basic-processes)."
requires-python = ">=3.11"
dependencies = ["viva-basic-processes>=0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pbg_basic_processes_shim"]
